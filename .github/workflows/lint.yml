name: Lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.21"

      - name: Check formatting
        run: uvx ruff@0.16.10 format --check --diff .

      - name: Lint
        run: uvx ruff@0.16.10 check --output-format=github .
