name: Build package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    # Builds a single py3-none-any wheel bundling both Windows and Linux binaries.
    # Must run on Linux: the build hook only patches the .so RPATHs there.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.21"

      - name: Install libnsl2
        run: |
          sudo apt-get update
          sudo apt-get install -y libnsl2

      - name: Build package
        run: uv build

      # Run from a copy of tests/ outside the repo so pytest imports the built
      # wheel rather than the source tree.
      - name: Test built wheel
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install -p "$RUNNER_TEMP/venv" dist/*.whl pytest
          mkdir "$RUNNER_TEMP/wheeltest"
          cp -r tests testdata "$RUNNER_TEMP/wheeltest/"
          cd "$RUNNER_TEMP/wheeltest"
          "$RUNNER_TEMP/venv/bin/python" -m pytest

      - name: Upload python package
        uses: actions/upload-artifact@v4
        with:
          name: mikecore
          path: dist
