[build-system]
requires = ["hatchling", "patchelf; sys_platform == 'linux'"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "buildUtil/build.py"

[tool.hatch.build.targets.sdist.force-include]
"mikecore/bin" = "mikecore/bin"

[tool.hatch.build.targets.wheel]
packages = ["mikecore", "miketools"]

[tool.hatch.build.targets.wheel.force-include]
"mikecore/bin" = "mikecore/bin"

[project]
name = "mikecore"
version = "0.3.0a1"
description = "MIKE Core contains core libraries, like DFS (Data File System), EUM and more."
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "DHI", email = "mike@dhigroup.com" }
]
# Only CPython versions that have not reached end of life; see docs/adr/0001-python-version-support.md
requires-python = ">=3.11"
dependencies = [
    "numpy"
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/DHI/mikecore-python"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=6.1.2",
]

[tool.pyright]
include = ["mikecore", "miketools", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Many attributes (e.g. FileInfo, TimeAxis, X/Y/Z) start as None and are set
# later, so most accesses trip these. Kept as warnings so real None
# dereferences stay visible; make them errors once those attributes are typed.
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportOptionalOperand = "warning"
# Existing violations need typing work (e.g. TimeAxis unions, List[int]
# parameters that receive numpy arrays). Kept visible as warnings for now.
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportOperatorIssue = "warning"
reportReturnType = "warning"
reportRedeclaration = "warning"

# ruff takes its target version from requires-python.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]
# The C#-style API is re-exported through star imports throughout.
ignore = [
    "F403", "F405",
    # Pending cleanup: these need case-by-case review rather than autofixing.
    "E711",  # `== None` can't blindly become `is None` where numpy arrays flow through
    "E722",  # bare except
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name
    "F811",  # duplicated test helpers whose bodies differ
    "F841",  # unused variables
]

[tool.ruff.lint.per-file-ignores]
# Manual test runners that import modules for their side effects.
"tests/Test.py" = ["F401", "E402"]
"tests/test_run_all.py" = ["F401"]
# Imports follow the native library path setup.
"mikecore/__init__.py" = ["E402"]
