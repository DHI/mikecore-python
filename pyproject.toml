[build-system]
requires = ["hatchling", "patchelf; sys_platform == 'linux'"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "buildUtil/build.py"

[tool.hatch.build.targets.sdist.force-include]
"mikecore/bin" = "mikecore/bin"

[tool.hatch.build.targets.wheel]
packages = ["mikecore", "miketools"]

[tool.hatch.build.targets.wheel.force-include]
"mikecore/bin" = "mikecore/bin"

[project]
name = "mikecore"
version = "0.3.0a1"
description = "MIKE Core contains core libraries, like DFS (Data File System), EUM and more."
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "DHI", email = "mike@dhigroup.com" }
]
requires-python = ">=3.5"
dependencies = [
    "numpy"
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3"
]

[project.urls]
Homepage = "https://github.com/DHI/mikecore-python"

[dependency-groups]
dev = [
    "pyright>=1.1.400; python_version >= '3.7'",
    "pytest>=6.1.2",
]

[tool.pyright]
include = ["mikecore", "miketools", "tests"]
typeCheckingMode = "basic"
# Many attributes (e.g. FileInfo, TimeAxis, X/Y/Z) start as None and are set
# later, so most accesses trip these. Kept as warnings so real None
# dereferences stay visible; make them errors once those attributes are typed.
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportOptionalOperand = "warning"
# Existing violations need typing work (e.g. TimeAxis unions, List[int]
# parameters that receive numpy arrays). Kept visible as warnings for now.
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportOperatorIssue = "warning"
reportReturnType = "warning"
reportRedeclaration = "warning"
